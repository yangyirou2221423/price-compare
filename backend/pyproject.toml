[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# B008: FastAPI Depends(...) in argument defaults is the framework idiom.
# RUF001-003: Chinese punctuation in user-facing strings is intentional.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# conftest sets environment variables before importing the app.
"tests/conftest.py" = ["E402"]
